<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ficha de Viaje</title>
<style>
body{font-family:Arial, sans-serif; background:#f4f4f4; margin:0; padding:30px;}
.ficha{max-width:600px; margin:auto; background:#ffffff; border-radius:10px; padding:25px; box-shadow:0 0 10px rgba(0,0,0,0.15);}
h1{color:#2c3e50; text-align:center; border-bottom:2px solid #2c3e50; padding-bottom:10px;}
.seccion{margin-bottom:20px; padding:15px; background:#ecf0f1; border-left:5px solid #2980b9; border-radius:5px;}
h2{margin-top:0; color:#2980b9; font-size:18px;}
p{margin:5px 0; color:#333333;}
</style>
</head>
<body>
<div class="ficha">
<h1>Ficha de Viaje</h1>
<div class="seccion">
<h2>Datos del Carro</h2>
<p><strong>Placa:</strong> xkz99h</p>
<p><strong>Marca:</strong> honda</p>
<p><strong>Color/Modelo:</strong> gris mate</p>
</div>
<div class="seccion">
<h2>Datos del Motor</h2>
<p><strong>Numero de serie:</strong> 465hhh</p>
<p><strong>Tipo:</strong> moto</p>
</div>
<div class="seccion">
<h2>Datos del Chofer</h2>
<p><strong>Cedula:</strong> 1010</p>
<p><strong>Nombre:</strong> Anamaría López</p>
<p><strong>Licencia:</strong> 10101000000000000000000000001111</p>
</div>
<div class="seccion">
<h2>Datos del Pasajero</h2>
<p><strong>Cedula:</strong> 456789</p>
<p><strong>Nombre completo:</strong> Clara</p>
</div>
</div>
</body>
</html>
